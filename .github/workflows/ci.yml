name: MaanakSetu CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  contract-verification:
    name: Compact Circuit Compilation & Simulation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Midnight Compact Compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Compact Compiler Version
        run: |
          compact --version

      - name: Install Contract Workspace Dependencies
        run: |
          cd contract
          npm ci || npm install

      - name: Compile MaanakSetu Compact Contract
        run: |
          cd contract
          compact compile src/maanaksetu.compact managed

      - name: Run Headless Simulation Test Suite
        run: |
          cd contract
          npm test

  frontend-build:
    name: Frontend Typecheck & Production Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Frontend Workspace Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Execute TypeScript Compiler Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Compile Production Web Bundle
        run: |
          cd frontend
          npm run build
