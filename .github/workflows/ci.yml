name: MaanakSetu CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  contract-verification:
    name: Compact Circuit Compilation & Simulation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Midnight Compact CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Compact Compiler Toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          compact update 0.31.1
          compact --version
          compact compile --version

      - name: Install Contract Workspace Dependencies
        working-directory: contract
        run: npm ci || npm install

      - name: Compile MaanakSetu Compact Contract
        working-directory: contract
        run: |
          set -euxo pipefail
          compact compile src/maanaksetu.compact managed

      - name: Verify Generated Compact Artifacts
        working-directory: contract
        run: |
          test -f managed/contract/index.js
          test -f managed/contract/index.d.ts
          test -f managed/compiler/contract-info.json
          test -d managed/zkir
          test -d managed/keys
          echo "All 28 Compact compiler artifacts verified."

      - name: Run Headless Simulation Test Suite
        working-directory: contract
        run: npm test

  frontend-build:
    name: Frontend Typecheck & Production Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Frontend Workspace Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Execute TypeScript Compiler Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Compile Production Web Bundle
        working-directory: frontend
        run: npm run build
